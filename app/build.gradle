plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.duodemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.duodemo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                def ksPath = props['storeFile'] ?: 'duodepth-release.jks'
                def ksFile = file(ksPath)
                if (!ksFile.exists()) {
                    ksFile = rootProject.file(ksPath)
                }
                storeFile ksFile
                storePassword props['storePassword'] ?: 'duodepth123'
                keyAlias props['keyAlias'] ?: 'duodepth'
                keyPassword props['keyPassword'] ?: 'duodepth123'
            } else {
                storeFile file('duodepth-release.jks')
                storePassword 'duodepth123'
                keyAlias 'duodepth'
                keyPassword 'duodepth123'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.exifinterface
}
